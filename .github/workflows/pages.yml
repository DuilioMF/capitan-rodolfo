name: Deploy Capitán Rodolfo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Regression test — Ver medios from paid dispatch
        run: node --test tests/ver-medios-navigation.test.js
      - name: Regression test — version visible in every screen
        run: node --test tests/version-every-window.test.js
      - name: Regression test — verified SQL circuit
        run: node --test verificable/verified-circuit.test.cjs
      - name: Prepare canonical GitHub source
        run: |
          mkdir -p dist
          cp *.html *.svg *.bat VERSION theme.css theme.js cobros.css cobros.js dist/
          cp -R assets bridge connector-node sql dist/
          mkdir -p dist/verificable
          cp verificable/verified-circuit.js dist/verificable/
          test -s dist/verificable/verified-circuit.js
          touch dist/.nojekyll
      - name: Verificar paquete FINAL antes de subir a GitHub Pages
        run: node --test tests/paquete-publicado.test.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Verificar VERSION publicado después de Pages
        shell: bash
        env:
          PUBLIC_VERSION_URL: https://duiliomf.github.io/capitan-rodolfo/VERSION
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n ' < VERSION)"
          [[ "$expected" =~ ^[0-9]+$ ]]
          matched=0
          for attempt in {1..12}; do
            observed="$(curl --location --silent --show-error --fail --max-time 12 --header 'Cache-Control: no-cache' "$PUBLIC_VERSION_URL?sha=${GITHUB_SHA}&attempt=$attempt" 2>/dev/null | tr -d '\r\n ' || true)"
            if [[ "$observed" == "$expected" ]]; then
              matched=1
              break
            fi
            sleep 5
          done
          if [[ "$matched" != 1 ]]; then
            echo "::error::VERSION público no coincide con GitHub (C$expected)"
            exit 1
          fi
          echo "VERSION público C$expected comprobado para $GITHUB_SHA"
