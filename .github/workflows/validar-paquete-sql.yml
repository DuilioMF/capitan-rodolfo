name: Validar paquete SQL Capitan
on:
  push:
    paths:
      - "sql/**"
      - "sp_allowlist.json"
      - "bridge/capitan_rodolfo_local.ps1"
      - "VERSION"
      - "nucleo.html"
      - "conexion-sql.html"
      - "index.html"
      - "documentos.html"
      - "theme.js"
      - ".github/workflows/validar-paquete-sql.yml"
  workflow_dispatch:

jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar PowerShell del conector
        shell: powershell
        run: |
          $file="bridge/capitan_rodolfo_local.ps1"
          $t=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$t,[ref]$errors)|Out-Null
          if($errors.Count){
            $errors|Select-Object -First 8|ForEach-Object{Write-Host ("L"+$_.Extent.StartLineNumber+": "+$_.Message)}
            throw "Conector no compila"
          }
          Write-Host "Conector PowerShell: sintaxis OK"
      - name: Arrancar conector real y verificar ruta Explorador SQL sin base privada
        shell: powershell
        run: |
          $testRoot=Join-Path $env:RUNNER_TEMP 'CapitanSqlTest'
          New-Item -ItemType Directory -Force -Path $testRoot,(Join-Path $testRoot 'bridge')|Out-Null
          Copy-Item VERSION,sp_allowlist.json $testRoot
          Copy-Item 'bridge/capitan_rodolfo_local.ps1' (Join-Path $testRoot 'bridge/capitan_rodolfo_local.ps1')
          $bridge=Join-Path $testRoot 'bridge/capitan_rodolfo_local.ps1'
          $stdout=Join-Path $testRoot 'stdout.log'
          $stderr=Join-Path $testRoot 'stderr.log'
          $proc=Start-Process powershell.exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$bridge,'-AppDir',$testRoot,'-BackgroundChild')
          try {
            $port=0
            $statusFile='C:\Sistemas\DoingLio\data\capitan\estado.json'
            for($attempt=0;$attempt -lt 35;$attempt++){
              Start-Sleep -Milliseconds 450
              $candidatePorts=@()
              if(Test-Path $statusFile){try{$candidatePorts += [int]((Get-Content $statusFile -Raw|ConvertFrom-Json).port)}catch{}}
              $candidatePorts += @(8787,8797,18787,27877,37877,48787,57877)
              foreach($candidate in @($candidatePorts|Select-Object -Unique)){
                if($candidate -lt 1024 -or $candidate -gt 65535){continue}
                try {
                  $h=Invoke-RestMethod "http://127.0.0.1:$candidate/health" -TimeoutSec 1
                  if($h.ok -and $h.service -eq 'Capitan Rodolfo Local'){$port=$candidate;break}
                } catch {}
              }
              if($port){break}
            }
            if(-not $port){
              if(Test-Path $stderr){Get-Content $stderr -Tail 25}
              throw 'El conector real no respondió /health'
            }
            $expectedVersion=(Get-Content VERSION -Raw).Trim()
            if([string]$h.version -ne $expectedVersion -or $h.apiSqlObject -ne $true){throw "Health incompatible: versión=$($h.version), esperado=$expectedVersion, Explorador=$($h.apiSqlObject)"}
            $uri="http://127.0.0.1:$port/api/sql/object"
            $body=@{sessionId='sesion-inexistente';database='SiSRL';name='dbo.Tanque';type='tabla';action='read'}|ConvertTo-Json
            $code=0
            try {
              $null=Invoke-WebRequest -UseBasicParsing -Uri $uri -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 5
              throw 'El endpoint aceptó una sesión inexistente'
            } catch [System.Net.WebException] {
              if($_.Exception.Response){$code=[int]$_.Exception.Response.StatusCode}
              else{throw}
            }
            if($code -ne 401){throw "El endpoint debe contestar 401 sin sesión, devolvió HTTP $code (404 indica ruta ausente)."}
            Write-Host 'Conector real $expectedVersion: health y ruta POST /api/sql/object OK. Sin SQL privado.'
          } finally {
            if($proc){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Comprobar versiones y autorizaciones
        shell: powershell
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          $bat=Get-Content CAPITAN_RODOLFO.bat -Raw
          $nucleo=Get-Content nucleo.html -Raw
          $datos=Get-Content conexion-sql.html -Raw
          if($bat -notmatch ('EXPECTED_VERSION='+[regex]::Escape($version))){throw "BAT desfasado"}
          if($nucleo -notmatch ('v'+[regex]::Escape($version))){throw "Nucleo desfasado"}
          if($datos -notmatch ('v'+[regex]::Escape($version))){throw "Datos desfasado"}
          $cfg=Get-Content sp_allowlist.json -Raw|ConvertFrom-Json
          foreach($name in @('dbo.PA_VentasFormasPago','dbo.PA_CapitanRodolfo_CircuitoEstacion')){
            if(@($cfg.procedures) -notcontains $name){throw "SP no habilitado: $name"}
          }
          Write-Host "Version $version y allowlist: OK"
      - name: Verificar paquete SQL sin ejecutar la base privada
        shell: powershell
        run: |
          $p='sql/PA_CapitanRodolfo_CircuitoEstacion.sql'
          if(!(Test-Path $p)){throw "Falta SQL"}
          $sql=Get-Content $p -Raw
          foreach($required in @(
            'CREATE OR ALTER PROCEDURE dbo.PA_CapitanRodolfo_CircuitoEstacion',
            '@IdEstacion',
            '@EstadoVta',
            'dbo.Tanque',
            'dbo.Prod',
            'dbo.Surpla',
            'dbo.Surtan',
            'dbo.Despachos',
            'dbo.RelacionCptsDespachos',
            'dbo.ParamStock',
            'Resultado 5: EMPRESA/ESTACIÓN',
            'sys.sp_executesql'
          )){
            if(!$sql.Contains($required)){throw "Falta contenido SQL: $required"}
          }
          if(!(Test-Path 'sql/README_CircuitoEstacion.md')){throw "Falta guia de despliegue"}
          if(!$sql.Contains('WITH EXECUTE AS OWNER')){throw "Falta el contexto propietario del SP"}
          if($sql -match 'TRY_CONVERT\\s*\\('){throw "TRY_CONVERT rompe compatibilidad con esta instancia"}
          if($sql -match 'CREATE\\s+OR\\s+ALTER\\s+PROCEDURE'){throw "CREATE OR ALTER no compatible con SQL anterior"}
          if(!$sql.Contains('ALTER PROCEDURE dbo.PA_CapitanRodolfo_CircuitoEstacion')){throw "Falta ALTER compatible"}
          if(!(Test-Path 'sql/DIAGNOSTICO_PERMISOS_CircuitoEstacion.sql')){throw "Falta diagnóstico permisos"}
          $permissions=Get-Content sql/DIAGNOSTICO_PERMISOS_CircuitoEstacion.sql -Raw
          if(!$permissions.Contains("HAS_PERMS_BY_NAME('dbo.Tanque'")){throw "Falta prueba SELECT Tanque"}
          if(!$permissions.Contains("PuedeEjecutarCircuito")){throw "Falta prueba permiso EXECUTE"}
          Write-Host "Paquete SQL: estructura y archivos OK. Ejecucion con esquema real pendiente."

      - name: Validar pantalla del camion y JS de las pantallas
        shell: powershell
        run: |
          $env:DOINGLIO_TESTDIR=$PWD.Path
          @'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          for(const filename of ['index.html','conexion-sql.html','nucleo.html','documentos.html']){
            const html=fs.readFileSync(filename,'utf8');
            for(const [i,match] of [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].entries()){
              const script=match[1].trim();if(!script)continue;
              const out=path.join(process.env.RUNNER_TEMP,filename.replace(/[^a-z0-9]/gi,'_')+'-'+i+'.js');
              fs.writeFileSync(out,script);
              cp.execFileSync('node',['--check',out],{stdio:'inherit'});
            }
            console.log('Sintaxis JS verificada:',filename);
          }
          const doc=fs.readFileSync('documentos.html','utf8');
          const index=fs.readFileSync('index.html','utf8');
          for(const marker of ['id="drop"','id="truckWrap"','id="file"','dragover','drop','/functions/v1/extract-document-json','JSON.stringify(extracted,null,2)','Comprobante (revisar tipo)']){
            if(!doc.includes(marker))throw Error('Falta función de camión: '+marker);
          }
          for(const marker of ['id="truckStep"','id="truckModal"','id="truckReader"','documentos.html?truck=1','/api/station/circuit','/api/station/ids','id="pumpModal"']){
            if(!index.includes(marker))throw Error('Falta integración con Estación: '+marker);
          }
          const explorer=fs.readFileSync('conexion-sql.html','utf8');
          const bridge=fs.readFileSync('bridge/capitan_rodolfo_local.ps1','utf8');
          if(explorer.includes('Procedimientos habilitados'))throw Error('La interfaz antigua sigue visible');
          for(const marker of ['id="sqlObjectName"','id="sqlObjectType"','id="inspectSql"','id="executeSp"','/api/sql/object','confirm:']){
            if(!explorer.includes(marker))throw Error('Falta explorador SQL: '+marker);
          }
          for(const marker of ["function Lookup-NamedSqlObject","'/api/sql/object'","SELECT TOP (200)","Invoke-AllowedStoredProcedure"]){
            if(!bridge.includes(marker))throw Error('Falta el endpoint SQL: '+marker);
          }
          if(!bridge.includes('function Lookup-NamedSqlObject'))throw Error('Falta resolver de objetos SQL');
          if(!bridge.includes('function Get-StationOptions'))throw Error('Falta resolver ParamStock');
          if(!bridge.includes("dbo.ParamStock"))throw Error('Falta consultar ParamStock');
          if(!bridge.includes('companyAvailable=($sets.Count -ge 5)'))throw Error('Falta quinto resultado en bridge');
          console.log('Explorador SQL por nombre: controles y ruta backend OK');
          // La misma función de Revalsoft SaaS debe conservar los tres tipos
          // y su estructura fiscal, sin escribir en la base de datos.
          const vm=require('vm');
          const reader=fs.readFileSync('documentos.html','utf8');
          const match=reader.match(/ function classify\\(data\\)\\{[\\s\\S]*?\\n \\}\\n function render\\(/);
          if(!match)throw Error('No existe el transformador compartido');
          const isolated=match[0].slice(0,-' function render('.length);
          const classify=vm.runInNewContext(isolated+'\\nclassify');
          for(const [tipo,expected] of [['FACTURA','Factura'],['RECIBO','Recibo'],['TRANSFERENCIA','Transferencia']]){
            const result=classify({tipo_documento:tipo,fecha:'2026-09-24',numero_operacion:'42',total:'120',items:[{descripcion:'Producto'}],iva:[{importe:'21'}]});
            if(result.tipo!==expected||result.items.length!==1||result.iva.length!==1||result.estado!=='pendiente_revision')throw Error('Clasificación o datos fiscales inválidos: '+tipo);
          }
          console.log('Revalsoft SaaS: transformación simulada de factura, recibo y transferencia OK');
          console.log('Camión y circuito enlazados: OK');
          '@ | Set-Content -Encoding UTF8 ($testFile=Join-Path $env:RUNNER_TEMP 'validate-pages.cjs')
          node "$testFile"
          if($LASTEXITCODE -ne 0){throw "El navegador no podrá ejecutar las pantallas"}
