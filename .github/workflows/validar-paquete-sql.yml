name: Validar paquete SQL Capitan
on:
  push:
    paths:
      - "sql/**"
      - "sp_allowlist.json"
      - "bridge/capitan_rodolfo_local.ps1"
      - "VERSION"
      - "nucleo.html"
      - "conexion-sql.html"
      - "index.html"
      - "documentos.html"
      - "theme.js"
      - ".github/workflows/validar-paquete-sql.yml"
  workflow_dispatch:

jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar PowerShell del conector
        shell: powershell
        run: |
          $file="bridge/capitan_rodolfo_local.ps1"
          $t=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$t,[ref]$errors)|Out-Null
          if($errors.Count){
            $errors|Select-Object -First 8|ForEach-Object{Write-Host ("L"+$_.Extent.StartLineNumber+": "+$_.Message)}
            throw "Conector no compila"
          }
          Write-Host "Conector PowerShell: sintaxis OK"
      - name: Comprobar versiones y autorizaciones
        shell: powershell
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          $bat=Get-Content CAPITAN_RODOLFO.bat -Raw
          $nucleo=Get-Content nucleo.html -Raw
          $datos=Get-Content conexion-sql.html -Raw
          if($bat -notmatch ('EXPECTED_VERSION='+[regex]::Escape($version))){throw "BAT desfasado"}
          if($nucleo -notmatch ('v'+[regex]::Escape($version))){throw "Nucleo desfasado"}
          if($datos -notmatch ('v'+[regex]::Escape($version))){throw "Datos desfasado"}
          $cfg=Get-Content sp_allowlist.json -Raw|ConvertFrom-Json
          foreach($name in @('dbo.PA_VentasFormasPago','dbo.PA_CapitanRodolfo_CircuitoEstacion')){
            if(@($cfg.procedures) -notcontains $name){throw "SP no habilitado: $name"}
          }
          Write-Host "Version $version y allowlist: OK"
      - name: Verificar paquete SQL sin ejecutar la base privada
        shell: powershell
        run: |
          $p='sql/PA_CapitanRodolfo_CircuitoEstacion.sql'
          if(!(Test-Path $p)){throw "Falta SQL"}
          $sql=Get-Content $p -Raw
          foreach($required in @(
            'CREATE OR ALTER PROCEDURE dbo.PA_CapitanRodolfo_CircuitoEstacion',
            '@IdEstacion',
            '@EstadoVta',
            'dbo.Tanque',
            'dbo.Prod',
            'dbo.Surpla',
            'dbo.Surtan',
            'dbo.Despachos',
            'dbo.RelacionCptsDespachos',
            'sys.sp_executesql'
          )){
            if(!$sql.Contains($required)){throw "Falta contenido SQL: $required"}
          }
          if(!(Test-Path 'sql/README_CircuitoEstacion.md')){throw "Falta guia de despliegue"}
          Write-Host "Paquete SQL: estructura y archivos OK. Ejecucion con esquema real pendiente."

      - name: Validar pantalla del camion y JS de las pantallas
        shell: powershell
        run: |
          $env:DOINGLIO_TESTDIR=$PWD.Path
          @'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          for(const filename of ['index.html','conexion-sql.html','nucleo.html','documentos.html']){
            const html=fs.readFileSync(filename,'utf8');
            for(const [i,match] of [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].entries()){
              const script=match[1].trim();if(!script)continue;
              const out=path.join(process.env.RUNNER_TEMP,`filename.replace(/[^a-z0-9]/gi,'_')+'-'+i+'.js'`);
              fs.writeFileSync(out,script);
              cp.execFileSync('node',['--check',out],{stdio:'inherit'});
            }
            console.log('Sintaxis JS verificada:',filename);
          }
          const doc=fs.readFileSync('documentos.html','utf8');
          const index=fs.readFileSync('index.html','utf8');
          for(const marker of ['id="drop"','id="truckWrap"','id="file"','dragover','drop','/functions/v1/extract-document-json','JSON.stringify(extracted,null,2)','Comprobante (revisar tipo)']){
            if(!doc.includes(marker))throw Error('Falta función de camión: '+marker);
          }
          for(const marker of ['id="truckStep"','id="truckModal"','id="truckReader"','documentos.html?truck=1','/api/station/circuit','/api/station/ids','id="pumpModal"']){
            if(!index.includes(marker))throw Error('Falta integración con Estación: '+marker);
          }
          console.log('Camión y circuito enlazados: OK');
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMPalidate-pages.cjs"
          node "$env:RUNNER_TEMPalidate-pages.cjs"
          if($LASTEXITCODE -ne 0){throw "El navegador no podrá ejecutar las pantallas"}
