<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Datos SQL · Capitán Rodolfo</title>
<style>
:root{--bg:#090806;--panel:#12100d;--line:#6e583a55;--ink:#f1eadc;--muted:#9d9486;--orange:#dc8623;--green:#5ee6a8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#2a180d,transparent 35%),#090806;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.box{width:min(680px,92vw);padding:28px;border:1px solid var(--line);border-radius:18px;background:#12100de8}.ey{font-size:9px;letter-spacing:.22em;color:var(--orange);font-weight:900}h1{margin:8px 0 10px}.muted{color:var(--muted);line-height:1.65}.status{margin:18px 0;padding:13px;border:1px solid var(--line);border-radius:10px}.ok{color:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{flex:1;min-width:210px;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:900}.open{background:linear-gradient(135deg,#dc8623,#f0a14c);color:#160d07}.back{border:1px solid var(--line);color:#ddd0bc}.small{font-size:11px;color:var(--muted);margin-top:14px}
</style>
</head><body>
<div class="box"><div class="ey">CAPITÁN RODOLFO · NÚCLEO</div><h1>Datos SQL</h1><div id="status" class="status">Buscando el servicio SQL local…</div><div class="actions"><a class="btn open" href="http://127.0.0.1:8787/">Abrir conexión SQL</a><a class="btn back" href="nucleo.html">← Volver a Núcleo</a></div><div class="small">DoingLio instala y actualiza el conector. No necesitás dejar una ventana DOS abierta.</div></div>
<script>
(async()=>{const s=document.getElementById('status');try{const r=await fetch('http://127.0.0.1:8787/health',{cache:'no-store',targetAddressSpace:'local'});if(!r.ok)throw 0;const d=await r.json();s.className='status ok';s.textContent='Servicio SQL activo · v'+d.version+(d.database?' · '+d.database:'');setTimeout(()=>location.href='http://127.0.0.1:8787/',500)}catch(_){s.textContent='El servicio SQL no está respondiendo. Cerrá esta página y abrí C:\\Sistemas\\DOINGLIO.bat para reiniciarlo.'}})();
</script></body></html>
